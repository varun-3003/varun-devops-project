
        script: |
  cd /home/ec2-user

  # clone if not exists
  if [ ! -d "varun-devops-project" ]; then
    git clone https://github.com/varun-3003/varun-devops-project.git
  fi

  cd varun-devops-project

  git pull origin main

  sudo docker stop varun-container || true
  sudo docker rm varun-container || true
  sudo docker rmi varun-app || true

  sudo docker build -t varun-app .
  sudo docker run -d -p 80:80 --name varun-container varun-app
