name: Deploy to EC2

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Deploy to EC2
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_KEY }}
          script: |
            cd varun-devops-project

            echo "Pull latest code"
            git pull origin main

            echo "Stop old container"
            docker rm -f varun-container || true

            echo "Build new image"
            docker build -t varun-app .

            echo "Run new container"
            docker run -d -p 80:80 --name varun-container varun-app
