name: Deploy to EC2

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Deploy to EC2
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            echo "🚀 Starting Deployment..."

            # Clone project if not exists
            if [ ! -d "/home/ec2-user/varun-devops-project" ]; then
              git clone https://github.com/varun-3003/varun-devops-project.git /home/ec2-user/varun-devops-project
            fi

            cd /home/ec2-user/varun-devops-project

            echo "📥 Pull latest code"
            git pull origin main

            echo "🛑 Stop old container"
            docker stop varun-container || true
            docker rm varun-container || true

            echo "🧹 Clean Docker"
            docker system prune -af || true

            echo "🏗 Build new image"
            docker build -t varun-app .

            echo "🚀 Run container"
            docker run -d -p 80:80 --name varun-container varun-app

            echo "✅ Deployment Completed"
